[package]
name = "rbs-studio"
version = "0.4.1"
description = "Visueller Cockpit-XP Rennbildschirm-Editor"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
sha2 = "0.10"
base64 = "0.22"
encoding_rs = "0.8"
quick-xml = "0.37"
tempfile = "3"
walkdir = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
